<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ringmaker</title>
<meta name="description" content="Ringe gestalten, in 3D betrachten, stapeln und für den 3D-Druck exportieren.">
<meta name="theme-color" content="#090b15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ringmaker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <main>
    <section class="view" id="view-bench" data-view="bench">
      <div class="stage" id="bench-stage">
        <div class="stage-top">
          <input id="ring-name" class="ring-name" type="text" maxlength="60" autocomplete="off" spellcheck="false" aria-label="Name des Rings">
          <div class="stage-actions">
            <button class="pill" id="btn-new" type="button">Neu</button>
            <button class="pill" id="btn-export" type="button">Export</button>
            <button class="pill primary" id="btn-save" type="button">Speichern</button>
          </div>
        </div>
        <div class="stage-bottom">
          <div class="stats" id="bench-stats"></div>
          <div class="stage-tools">
            <button class="round" id="btn-spin" type="button" aria-label="Automatisch drehen" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 2v5h-5M6 22v-5h5"/></svg>
            </button>
            <button class="round" id="btn-home" type="button" aria-label="Ansicht zurücksetzen">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="panel">
        <nav class="segs" id="segs" aria-label="Einstellungen"></nav>
        <div class="controls" id="controls"></div>
      </div>
    </section>

    <section class="view scroll" id="view-gallery" data-view="gallery" hidden>
      <header class="page-head">
        <div>
          <h1>Galerie</h1>
          <p id="gallery-sub"></p>
        </div>
        <div class="head-actions">
          <button class="pill" id="btn-import" type="button">Importieren</button>
          <button class="pill" id="btn-backup" type="button">Sichern</button>
        </div>
      </header>
      <div class="grid" id="gallery-grid"></div>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </section>

    <section class="view" id="view-stack" data-view="stack" hidden>
      <div class="stage" id="stack-stage">
        <div class="stage-top">
          <div class="seg-toggle" id="stack-mode" role="group" aria-label="Darstellung">
            <button type="button" data-mode="stack">Gestapelt</button>
            <button type="button" data-mode="row">Nebeneinander</button>
          </div>
          <label class="check"><input type="checkbox" id="stack-finger"> Ringstab</label>
        </div>
        <div class="stage-bottom"><div class="stats" id="stack-stats"></div></div>
        <div class="stage-empty" id="stack-empty" hidden>Noch keine Ringe im Stapel.</div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h2>Stapel</h2>
          <button class="pill primary" id="btn-stack-add" type="button">Ring hinzufügen</button>
        </div>
        <div class="controls" id="stack-list"></div>
      </div>
    </section>

    <section class="view scroll" id="view-book" data-view="book" hidden>
      <div id="book-list"></div>
      <article id="book-detail" hidden></article>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Bereiche">
    <button type="button" data-tab="bench" aria-current="page">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="6.5"/><path d="M9 7.6 7.5 3.5h9L15 7.6"/></svg><span>Werkbank</span>
    </button>
    <button type="button" data-tab="gallery">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Galerie</span>
    </button>
    <button type="button" data-tab="stack">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7.5" ry="3"/><path d="M4.5 7v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V7M4.5 12v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5"/></svg><span>Stapel</span>
    </button>
    <button type="button" data-tab="book">
      <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.500 0 6 .5 8 2 2-1.500 4.500-2 8-2v-13c-3.500 0-6 .5-8 2zM12 6.500v13"/></svg><span>Stilbuch</span>
    </button>
  </nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
